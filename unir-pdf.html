<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDFconvert — Unir PDF</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<!-- pdf.js: dibuja la miniatura de la primera página de cada archivo -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<!-- pdf-lib: arma el PDF final combinando las páginas de todos los archivos -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<style>
  :root{
    --ink:        #202521;
    --paper:      #F6F2E9;
    --line:       #D9D1BC;
    --brand-red:  #B23A2E;
    --accent:     #4A6B2A; /* mismo tono usado para "Unir PDF" en la página principal */
    --accent-dim: #E9EFE1;
    --muted:      #8A8372;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
  }

  /* ---------- Encabezado ---------- */
  header{
    background: var(--brand-red);
    padding: 26px 40px;
    display: flex;
    align-items: center;
    gap: 18px;
  }

  /* ═══ Cambia href="#" por la ruta real de tu página principal ═══ */
  .back{
    display: flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    height: 46px;
    background: var(--accent);
    border-radius: 8px;
    text-decoration: none;
    flex-shrink: 0;
    transition: filter 0.15s ease;
  }
  .back:hover{ filter: brightness(1.1); }
  .back svg{ width: 22px; height: 22px; }

  .brand{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(1.5rem, 3vw, 1.9rem);
    color: #FBF6EC;
    margin: 0;
    letter-spacing: -0.01em;
  }

  /* ---------- Contenido ---------- */
  main{
    max-width: 760px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }

  .step-label{
    font-size: 0.85rem;
    color: var(--muted);
    margin: 0 0 8px 2px;
  }

  /* ---------- Zona de carga ---------- */
  .dropzone{
    border: 1.5px dashed var(--line);
    border-radius: 10px;
    background: #FFFDF8;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 32px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .dropzone.drag-over{ border-color: var(--accent); background: var(--accent-dim); }
  .dropzone svg{ width: 40px; height: 40px; opacity: 0.7; }
  .dropzone .main-text{ font-size: 1.05rem; font-weight: 500; }
  .dropzone .sub-text{ font-size: 0.85rem; color: var(--muted); }

  /* ---------- Lista de archivos ---------- */
  #file-list{
    list-style: none;
    margin: 28px 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .file-item{
    display: flex;
    align-items: center;
    gap: 14px;
    background: #FFFDF8;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    cursor: grab;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  }
  .file-item:active{ cursor: grabbing; }
  .file-item.dragging{ opacity: 0.4; }
  .file-item.drag-over-top{ border-top: 2px solid var(--accent); }
  .file-item.drag-over-bottom{ border-bottom: 2px solid var(--accent); }

  .file-item .order-num{
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--accent-dim);
    color: var(--accent);
    font-size: 0.78rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .file-item .handle{
    color: var(--muted);
    flex-shrink: 0;
    display: flex;
  }
  .file-item .handle svg{ width: 16px; height: 16px; }

  .file-item canvas{
    width: 34px;
    height: 46px;
    object-fit: cover;
    border: 1px solid var(--line);
    border-radius: 3px;
    flex-shrink: 0;
    background: #fff;
  }

  .file-item .info{ flex: 1; min-width: 0; }
  .file-item .info .fname{
    font-size: 0.92rem;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .file-item .info .fmeta{ font-size: 0.78rem; color: var(--muted); }

  .file-item .remove-btn{
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 6px;
    border-radius: 6px;
    display: flex;
    flex-shrink: 0;
  }
  .file-item .remove-btn:hover{ color: var(--brand-red); background: var(--accent-dim); }
  .file-item .remove-btn svg{ width: 16px; height: 16px; }

  .reorder-hint{
    font-size: 0.8rem;
    color: var(--muted);
    margin: 10px 2px 0;
    display: none;
  }
  .reorder-hint.visible{ display: block; }

  .add-more-btn{
    margin-top: 16px;
    background: none;
    border: 1px dashed var(--line);
    border-radius: 8px;
    padding: 12px;
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    color: var(--accent);
    cursor: pointer;
    display: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .add-more-btn.visible{ display: block; }
  .add-more-btn:hover{ border-color: var(--accent); background: var(--accent-dim); }

  /* ---------- Fila de resultado ---------- */
  .download-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
    border-top: 1px solid var(--line);
    margin-top: 32px;
    padding-top: 24px;
  }
  .download-row p{ margin: 0; font-size: 1rem; }
  .download-row .result-detail{ font-size: 0.85rem; color: var(--muted); margin-top: 4px; }

  .primary-btn{
    background: var(--brand-red);
    color: #FBF6EC;
    border: none;
    border-radius: 8px;
    padding: 13px 28px;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.15s ease;
    white-space: nowrap;
  }
  .primary-btn:disabled{ background: #D9D1BC; color: #A79E8A; cursor: not-allowed; }
  .primary-btn:not(:disabled):hover{ filter: brightness(1.08); transform: translateY(-1px); }

  footer{ text-align: center; padding: 28px 20px 40px; color: var(--muted); font-size: 0.85rem; }

  @media (prefers-reduced-motion: reduce){ *{ transition: none !important; } }
</style>
</head>
<body>

<header>
  <a class="back" href="#" data-target="index.html" aria-label="Volver">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M19 12H5M5 12l6-6M5 12l6 6" stroke="#FBF6EC" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>
  <h1 class="brand">PDFconvert</h1>
</header>

<main>
  <p class="step-label">Unir PDF</p>

  <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Subir archivos PDF">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M12 4v11m0 0-4-4m4 4 4-4M5 17v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="main-text" id="dz-main">Subir archivos</span>
    <span class="sub-text" id="dz-sub">Arrastra dos o más PDF aquí o haz clic para elegirlos</span>
  </div>
  <input type="file" id="file-input" accept="application/pdf,.pdf" multiple hidden>

  <ul id="file-list"></ul>
  <p class="reorder-hint" id="reorder-hint">Arrastra los archivos para cambiar el orden en el que se unirán</p>
  <button class="add-more-btn" id="add-more-btn" type="button">+ Agregar más archivos</button>

  <div class="download-row">
    <div>
      <p id="result-label">Sube al menos dos archivos PDF</p>
      <p class="result-detail" id="result-detail"></p>
    </div>
    <button class="primary-btn" id="action-btn" disabled>Unir y descargar</button>
  </div>
</main>

<footer>PDFconvert · Herramientas para tus documentos</footer>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const { PDFDocument } = PDFLib;

  const dropzone      = document.getElementById('dropzone');
  const fileInput     = document.getElementById('file-input');
  const dzMain        = document.getElementById('dz-main');
  const dzSub         = document.getElementById('dz-sub');

  const fileListEl    = document.getElementById('file-list');
  const reorderHint   = document.getElementById('reorder-hint');
  const addMoreBtn    = document.getElementById('add-more-btn');

  const resultLabel   = document.getElementById('result-label');
  const resultDetail  = document.getElementById('result-detail');
  const actionBtn     = document.getElementById('action-btn');

  // Cada entrada: { id, file, arrayBuffer, numPages, thumbCanvas }
  let entries = [];
  let idCounter = 0;
  let readyDownload = null;
  let dragSrcIndex = null;

  // ==================================================================
  // Selección de archivos
  // ==================================================================
  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
  });
  addMoreBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', (e) => addFiles(Array.from(e.target.files)));

  ['dragenter', 'dragover'].forEach(evt =>
    dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add('drag-over'); })
  );
  ['dragleave', 'drop'].forEach(evt =>
    dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove('drag-over'); })
  );
  dropzone.addEventListener('drop', (e) => addFiles(Array.from(e.dataTransfer.files)));

  async function addFiles(files){
    const pdfFiles = files.filter(f =>
      f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf')
    );
    if (!pdfFiles.length) return;

    dzMain.textContent = 'Cargando…';

    for (const file of pdfFiles){
      const entry = {
        id: ++idCounter,
        file,
        arrayBuffer: null,
        numPages: null,
        error: false
      };
      entries.push(entry);
      renderList(); // muestra el item de inmediato con estado "cargando"

      try {
        entry.arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: entry.arrayBuffer.slice(0) }).promise;
        entry.numPages = pdf.numPages;

        const page = await pdf.getPage(1);
        const viewport = page.getViewport({ scale: 0.3 });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        entry.thumbCanvas = canvas;

      } catch (err) {
        console.error(err);
        entry.error = true;
      }
      renderList();
    }

    dzMain.textContent = 'Subir archivos';
    dzSub.textContent = 'Arrastra más PDF aquí o haz clic para elegirlos';
    fileInput.value = '';
    updateSummary();
  }

  // ==================================================================
  // Lista, orden y borrado
  // ==================================================================
  function renderList(){
    fileListEl.innerHTML = '';

    entries.forEach((entry, index) => {
      const li = document.createElement('li');
      li.className = 'file-item';
      li.draggable = true;
      li.dataset.id = entry.id;

      const orderNum = document.createElement('div');
      orderNum.className = 'order-num';
      orderNum.textContent = index + 1;

      const handle = document.createElement('div');
      handle.className = 'handle';
      handle.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="8" cy="6" r="1.4"/><circle cx="8" cy="12" r="1.4"/><circle cx="8" cy="18" r="1.4"/><circle cx="16" cy="6" r="1.4"/><circle cx="16" cy="12" r="1.4"/><circle cx="16" cy="18" r="1.4"/></svg>';

      const info = document.createElement('div');
      info.className = 'info';
      const fname = document.createElement('div');
      fname.className = 'fname';
      fname.textContent = entry.file.name;
      const fmeta = document.createElement('div');
      fmeta.className = 'fmeta';
      fmeta.textContent = entry.error
        ? 'No se pudo leer este archivo'
        : (entry.numPages ? `${entry.numPages} página${entry.numPages > 1 ? 's' : ''}` : 'Cargando…');
      info.appendChild(fname);
      info.appendChild(fmeta);

      const removeBtn = document.createElement('button');
      removeBtn.className = 'remove-btn';
      removeBtn.type = 'button';
      removeBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
      removeBtn.addEventListener('click', () => {
        entries = entries.filter(e => e.id !== entry.id);
        renderList();
        updateSummary();
      });

      li.appendChild(orderNum);
      li.appendChild(handle);
      if (entry.thumbCanvas) li.appendChild(entry.thumbCanvas);
      li.appendChild(info);
      li.appendChild(removeBtn);

      // --- drag to reorder ---
      li.addEventListener('dragstart', () => {
        dragSrcIndex = index;
        li.classList.add('dragging');
      });
      li.addEventListener('dragend', () => {
        li.classList.remove('dragging');
        fileListEl.querySelectorAll('.file-item').forEach(el =>
          el.classList.remove('drag-over-top', 'drag-over-bottom')
        );
      });
      li.addEventListener('dragover', (e) => {
        e.preventDefault();
        const rect = li.getBoundingClientRect();
        const isTopHalf = (e.clientY - rect.top) < rect.height / 2;
        li.classList.toggle('drag-over-top', isTopHalf);
        li.classList.toggle('drag-over-bottom', !isTopHalf);
      });
      li.addEventListener('dragleave', () => {
        li.classList.remove('drag-over-top', 'drag-over-bottom');
      });
      li.addEventListener('drop', (e) => {
        e.preventDefault();
        const rect = li.getBoundingClientRect();
        const isTopHalf = (e.clientY - rect.top) < rect.height / 2;
        let targetIndex = index + (isTopHalf ? 0 : 1);
        if (dragSrcIndex === null || dragSrcIndex === targetIndex) return;

        const [moved] = entries.splice(dragSrcIndex, 1);
        if (dragSrcIndex < targetIndex) targetIndex--;
        entries.splice(targetIndex, 0, moved);

        dragSrcIndex = null;
        renderList();
        updateSummary();
      });

      fileListEl.appendChild(li);
    });

    reorderHint.classList.toggle('visible', entries.length > 1);
    addMoreBtn.classList.toggle('visible', entries.length > 0);
  }

  function updateSummary(){
    invalidateResult();

    const validEntries = entries.filter(e => !e.error && e.numPages);
    const totalPages = validEntries.reduce((sum, e) => sum + e.numPages, 0);

    if (entries.length === 0){
      resultLabel.textContent = 'Sube al menos dos archivos PDF';
      resultDetail.textContent = '';
      actionBtn.disabled = true;
    } else if (entries.length === 1){
      resultLabel.textContent = 'Agrega al menos un archivo más para unir';
      resultDetail.textContent = '';
      actionBtn.disabled = true;
    } else if (validEntries.length !== entries.length){
      resultLabel.textContent = 'Hay archivos que no se pudieron leer';
      resultDetail.textContent = 'Quítalos de la lista para continuar';
      actionBtn.disabled = true;
    } else {
      resultLabel.textContent = `Se unirán ${entries.length} archivos en un solo PDF`;
      resultDetail.textContent = `${totalPages} páginas en total`;
      actionBtn.disabled = false;
    }
  }

  function invalidateResult(){
    if (readyDownload){
      URL.revokeObjectURL(readyDownload.url);
      readyDownload = null;
    }
  }

  // ==================================================================
  // Unir y descargar
  // ==================================================================
  actionBtn.addEventListener('click', async () => {
    if (entries.length < 2) return;

    actionBtn.disabled = true;
    const originalLabel = actionBtn.textContent;
    actionBtn.textContent = 'Uniendo…';

    try {
      const mergedDoc = await PDFDocument.create();

      for (const entry of entries){
        const srcDoc = await PDFDocument.load(entry.arrayBuffer.slice(0));
        const copiedPages = await mergedDoc.copyPages(srcDoc, srcDoc.getPageIndices());
        copiedPages.forEach(p => mergedDoc.addPage(p));
      }

      const bytes = await mergedDoc.save();
      const blob = new Blob([bytes], { type: 'application/pdf' });

      readyDownload = {
        url: URL.createObjectURL(blob),
        filename: 'documentos-unidos.pdf'
      };

      const a = document.createElement('a');
      a.href = readyDownload.url;
      a.download = readyDownload.filename;
      document.body.appendChild(a);
      a.click();
      a.remove();

      resultDetail.textContent = `Descargado: ${readyDownload.filename}`;

    } catch (err) {
      console.error(err);
      resultLabel.textContent = 'Ocurrió un error al unir los archivos';
    } finally {
      actionBtn.textContent = originalLabel;
      actionBtn.disabled = false;
    }
  });

  // Botón de volver
  document.querySelector('.back[data-target]').addEventListener('click', function (e) {
    if (this.getAttribute('href') === '#') {
      e.preventDefault();
      window.location.href = this.getAttribute('data-target');
    }
  });
</script>

</body>
</html>
