<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDFconvert — De PDF a Imagen</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<!-- pdf.js: lee el PDF en el navegador y dibuja cada página en un canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<!-- JSZip: cuando el PDF tiene varias páginas, empaqueta las imágenes en un .zip -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
  :root{
    --ink:        #202521;
    --paper:      #F6F2E9;
    --line:       #D9D1BC;
    --brand-red:  #B23A2E;
    --accent:     #1E7A83; /* mismo teal usado para "imagen" en la página principal */
    --accent-dim: #E4EFEF;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
  }

  /* ---------- Encabezado ---------- */
  header{
    background: var(--brand-red);
    padding: 26px 40px;
    display: flex;
    align-items: center;
    gap: 18px;
  }

  /*
    Botón de volver. El href="#" es un marcador: cámbialo por la ruta
    real de tu página principal, por ejemplo href="index.html"
  */
  .back{
    display: flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    height: 46px;
    background: var(--accent);
    border-radius: 8px;
    text-decoration: none;
    flex-shrink: 0;
    transition: filter 0.15s ease;
  }
  .back:hover{ filter: brightness(1.08); }
  .back svg{ width: 22px; height: 22px; }

  .brand{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(1.5rem, 3vw, 1.9rem);
    color: #FBF6EC;
    margin: 0;
    letter-spacing: -0.01em;
  }

  /* ---------- Contenido ---------- */
  main{
    max-width: 720px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }

  .step-label{
    font-size: 0.85rem;
    color: #8A8372;
    margin: 0 0 8px 2px;
  }

  .dropzone{
    border: 1.5px dashed var(--line);
    border-radius: 10px;
    background: #FFFDF8;
    min-height: 230px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 32px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .dropzone.drag-over{
    border-color: var(--accent);
    background: var(--accent-dim);
  }

  .dropzone.has-error{
    border-color: var(--brand-red);
  }

  .dropzone svg{ width: 40px; height: 40px; opacity: 0.7; }

  .dropzone .main-text{
    font-size: 1.05rem;
    font-weight: 500;
  }

  .dropzone .sub-text{
    font-size: 0.85rem;
    color: #8A8372;
  }

  .progress-bar{
    width: 100%;
    max-width: 260px;
    height: 6px;
    border-radius: 999px;
    background: var(--accent-dim);
    overflow: hidden;
    display: none;
  }
  .progress-bar.visible{ display: block; }
  .progress-bar > div{
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width 0.2s ease;
  }

  /* ---------- Fila de descarga ---------- */
  .download-row{
    margin-top: 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }

  .download-row p{
    margin: 0;
    font-size: 1rem;
  }

  .download-btn{
    background: var(--brand-red);
    color: #FBF6EC;
    border: none;
    border-radius: 8px;
    padding: 13px 30px;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.15s ease;
  }

  .download-btn:disabled{
    background: #D9D1BC;
    color: #A79E8A;
    cursor: not-allowed;
  }

  .download-btn:not(:disabled):hover{
    filter: brightness(1.08);
    transform: translateY(-1px);
  }

  footer{
    text-align: center;
    padding: 28px 20px 40px;
    color: #8A8372;
    font-size: 0.85rem;
  }

  @media (prefers-reduced-motion: reduce){
    .back, .download-btn, .dropzone{ transition: none; }
  }
</style>
</head>
<body>

<header>
  <!-- ═══ Cambia href="#" por la ruta real de tu página principal ═══ -->
  <a class="back" href="#" data-target="index.html" aria-label="Volver">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M19 12H5M5 12l6-6M5 12l6 6" stroke="#FBF6EC" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>
  <h1 class="brand">PDFconvert</h1>
</header>

<main>
  <p class="step-label">De PDF a imagen (JPG)</p>

  <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Subir archivo PDF">
    <svg viewBox="0 0 24 24" fill="none" id="dz-icon">
      <path d="M12 4v11m0 0-4-4m4 4 4-4M5 17v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="main-text" id="dz-main">Subir archivo</span>
    <span class="sub-text" id="dz-sub">Arrastra un PDF aquí o haz clic para elegirlo</span>
    <div class="progress-bar" id="progress-bar"><div id="progress-fill"></div></div>
  </div>

  <input type="file" id="file-input" accept="application/pdf,.pdf" hidden>

  <div class="download-row">
    <p>Descargar nuevo archivo</p>
    <button class="download-btn" id="download-btn" disabled>Descargar</button>
  </div>
</main>

<footer>PDFconvert · Herramientas para tus documentos</footer>

<script>
  // El worker de pdf.js necesita cargarse desde el mismo CDN que la librería.
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const dropzone     = document.getElementById('dropzone');
  const fileInput     = document.getElementById('file-input');
  const dzMain         = document.getElementById('dz-main');
  const dzSub          = document.getElementById('dz-sub');
  const progressBar   = document.getElementById('progress-bar');
  const progressFill  = document.getElementById('progress-fill');
  const downloadBtn   = document.getElementById('download-btn');

  // Guarda el resultado listo para descargar (una imagen o un zip).
  let readyDownload = null; // { url, filename }

  // Calidad de exportación del JPG (0 a 1) y escala de render (más alto = más nítido y más pesado).
  const JPG_QUALITY = 0.92;
  const RENDER_SCALE = 2;

  function resetDropzoneUI(){
    dropzone.classList.remove('has-error');
    progressBar.classList.remove('visible');
    progressFill.style.width = '0%';
  }

  function setError(message){
    resetDropzoneUI();
    dropzone.classList.add('has-error');
    dzMain.textContent = message;
    dzSub.textContent = 'Intenta con otro archivo PDF';
    downloadBtn.disabled = true;
  }

  function baseName(filename){
    return filename.replace(/\.pdf$/i, '');
  }

  async function handleFile(file){
    if (!file) return;

    if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
      setError('Ese archivo no es un PDF');
      return;
    }

    resetDropzoneUI();
    downloadBtn.disabled = true;
    if (readyDownload) { URL.revokeObjectURL(readyDownload.url); readyDownload = null; }

    dzMain.textContent = 'Convirtiendo…';
    dzSub.textContent = file.name;
    progressBar.classList.add('visible');

    try {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const numPages = pdf.numPages;
      const name = baseName(file.name);

      const jpgBlobs = [];

      for (let i = 1; i <= numPages; i++) {
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: RENDER_SCALE });

        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        const ctx = canvas.getContext('2d');

        await page.render({ canvasContext: ctx, viewport }).promise;

        const blob = await new Promise(resolve =>
          canvas.toBlob(resolve, 'image/jpeg', JPG_QUALITY)
        );
        jpgBlobs.push(blob);

        progressFill.style.width = Math.round((i / numPages) * 100) + '%';
      }

      if (numPages === 1) {
        readyDownload = {
          url: URL.createObjectURL(jpgBlobs[0]),
          filename: name + '.jpg'
        };
      } else {
        const zip = new JSZip();
        jpgBlobs.forEach((blob, idx) => {
          zip.file(`${name}-pagina-${idx + 1}.jpg`, blob);
        });
        const zipBlob = await zip.generateAsync({ type: 'blob' });
        readyDownload = {
          url: URL.createObjectURL(zipBlob),
          filename: name + '-imagenes.zip'
        };
      }

      dzMain.textContent = 'Listo';
      dzSub.textContent = `${file.name} — ${numPages} página${numPages > 1 ? 's' : ''} convertida${numPages > 1 ? 's' : ''}`;
      progressBar.classList.remove('visible');
      downloadBtn.disabled = false;

    } catch (err) {
      console.error(err);
      setError('No se pudo leer el PDF');
    }
  }

  // --- Interacción con el recuadro ---
  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
  });

  fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

  ['dragenter', 'dragover'].forEach(evt =>
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.add('drag-over');
    })
  );
  ['dragleave', 'drop'].forEach(evt =>
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.remove('drag-over');
    })
  );
  dropzone.addEventListener('drop', (e) => {
    const file = e.dataTransfer.files[0];
    handleFile(file);
  });

  // --- Botón Descargar ---
  downloadBtn.addEventListener('click', () => {
    if (!readyDownload) return;
    const a = document.createElement('a');
    a.href = readyDownload.url;
    a.download = readyDownload.filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
  });

  // --- Botón de volver: navega solo si el href sigue siendo el marcador "#" ---
  document.querySelector('.back[data-target]').addEventListener('click', function (e) {
    if (this.getAttribute('href') === '#') {
      e.preventDefault();
      window.location.href = this.getAttribute('data-target');
    }
  });
</script>

</body>
</html>
